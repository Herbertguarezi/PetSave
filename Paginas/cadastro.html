<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PetSave</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cactus+Classical+Serif&family=Oi&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../Estilos/style.css" />
    <link rel="stylesheet" href="../Estilos/cadastro.css" />
  </head>
  <body>
    <section class="container-login">
      <div class="login-container">
        <div class="login">
          <h1 class="titulo-dark">PetSave</h1>
          <p class="fonte-l dark">
            Uma rede de apoio entre a comunidade, tutores, ONGs e autoridades.
          </p>
        </div>
      </div>
      <div class="login-form-container">
        <div class="login-form">
          <h2 class="titulo-dark-l">Cadastro</h2>
          <form action="">
            <label for="nome" class="fonte-r">Nome</label>
            <input type="text" id="nome" name="nome"/>
            <label for="nascimento" class="fonte-r">Data de Nascimento</label>
            <input type="date" id="nascimento" name="nascimento" />
            <label for="email" class="fonte-r">E-mail</label>
            <input type="email" id="email" name="email" />
            <label for="senha" class="fonte-r">Senha</label>
            <input type="password" id="senha" name="senha" />
            <button class="btn-amarelo btn-entrar" id="btn_entrar">Cadastrar</button>
          </form>
          <p class="fonte-r" style="color: red; margin-top: 10px; display: none;" id="erro">Email já existe</p>
          <p class="fonte-r" style="color: green; margin-top: 10px; display: none;" id="sucesso">Cadastro Efetuado Com Sucesso ! </p>
            <a
              href="./login.html"
              class="login-esqueci-senha fonte-r"
              style="text-decoration: underline"
              >← Voltar ao Login</a
            >
          </div>
        </div>
      </div>
    </section>
    <script src="../Js/script.js" type="module"></script>
    <script src="./Js/autenticacao.js" type="module"></script>
    <script src="../Js/cadastro.js" type="module"></script>
  </body>
</html>
