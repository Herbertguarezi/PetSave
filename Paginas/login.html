<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetSave</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cactus+Classical+Serif&family=Oi&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../Estilos/style.css">
    <link rel="stylesheet" href="../Estilos/login.css">
</head>
<body>
    <section class="container-login">

        <div class="login-container">
            <div class="login">
                <h1 class="titulo-white">
                    PetSave
                </h1>
                <p class="fonte-l white">
                    Uma rede de apoio entre a comunidade, tutores, ONGs e autoridades.
                </p>
            </div>
        </div>
        <div class="login-form-container">
            <div class="login-form">
                <h2 class="titulo-dark-l">Entrar</h2>
                <form action="">
                    <label for="email" class="fonte-r">E-mail</label>
                    <input type="email" class="email" name="email">
                    <label for="senha" class="fonte-r">Senha</label>
                    <input type="password" class="senha mono" name="senha">
                    <button class="btn-roxo btn-entrar">Entrar</button>
                </form>
                <div class="login-esqueci">
                    <a href="./esqueciSenha.html" class="login-esqueci-senha fonte-r">Esqueci minha senha</a>
                    <button class="btn-amarelo">Cadastrar</button>
                </div>
            </div>
        </div>
    </section>
    <script src="../Js/script.js"></script>
    <script src="../Js/senha.js"></script>
</body>
</html>
